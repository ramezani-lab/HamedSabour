services:
  coordinator:
    image: citusdata/citus
    container_name: coordinator
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - coordinator_data:/var/lib/postgresql
    networks:
      - citus-net

  worker1:
    image: citusdata/citus
    container_name: worker1
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - worker1_data:/var/lib/postgresql
    networks:
      - citus-net

  worker2:
    image: citusdata/citus
    container_name: worker2
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - worker2_data:/var/lib/postgresql
    networks:
      - citus-net

networks:
  citus-net:
    driver: bridge

volumes:
  coordinator_data:
  worker1_data:
  worker2_data:
